[project]
name = "trading-system"
version = "0.1.0"
description = "AI-assisted automated trading system — deterministic authority layer"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0,<7",
    "aiosqlite>=0.20,<1",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
    "fastapi>=0.110",
    "uvicorn>=0.28",
    "websockets>=12.0",
]

[project.optional-dependencies]
analytics = [
    "duckdb>=1.0,<2",
    "pyarrow>=16,<18",
    "pytz>=2024.1",
]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    "mypy>=1.10,<2",
    "ruff>=0.5,<1",
    "types-PyYAML>=6.0",
    "types-aiofiles>=24.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
    "core*",
    "adapters*",
    "backtesting*",
    "data*",
    "integration*",
    "knowledge*",
    "operations*",
    "web*",
    "migrations*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
    "S101",  # assert usage OK in tests
    "B008",  # function call in default argument (Pydantic)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E741"]
"scripts/**" = ["S101", "S105", "S106", "S108", "E741"]
"web/api/auth.py" = ["S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["core", "adapters", "integration", "operations", "data", "backtesting", "knowledge", "web"]

[tool.coverage.run]
source = ["core", "adapters", "operations", "integration"]
omit = ["tests/*", "*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 80
