# Test Environment Configuration
# Uses MockExchange — In-memory / isolated test settings

trading_mode: DEVELOPMENT

database:
  path: ":memory:"
  wal_mode: false

exchange:
  adapter: mock
  simulated_latency_ms: 0

risk:
  policy_file: configs/risk.yaml

logging:
  level: DEBUG
  file: logs/trading_test.log
  structured: false

obsidian:
  vault_path: /tmp/test-vault
  enabled: false
