# Default Risk Policy Configuration
# See architecture.md §7 and implementation_spec.md §3
# This file is loaded at startup and is IMMUTABLE at runtime.
# Changes require a restart.

policy_version: "1.0"

# Position limits (as fraction of portfolio)
max_position_size_pct: 0.05
max_portfolio_exposure_pct: 0.50
max_symbol_exposure_pct: 0.20
max_strategy_exposure_pct: 0.30
max_correlated_exposure_pct: 0.40

# Loss limits (as fraction of portfolio)
max_daily_loss_pct: 0.03
max_weekly_loss_pct: 0.07
max_drawdown_pct: 0.15

# Order limits
max_order_notional: 10000.0
max_concurrent_positions: 5
max_concurrent_orders: 10
max_leverage: 3.0

# Market quality thresholds
max_spread_pct: 0.005
max_slippage_pct: 0.01
min_liquidity_usd: 50000.0

# Data health
stale_data_timeout_seconds: 60
max_price_deviation_pct: 0.10

# Restrictions
macro_event_restriction: false
